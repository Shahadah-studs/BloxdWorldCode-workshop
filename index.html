<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxdWorldCode | Mod Workshop</title>
    <link rel="stylesheet" href="style.css">
 <link rel="icon" type="image/png" href="/favicon.png?v=5">
</head>
<body>

    <div class="workshop-container">
        <header class="workshop-header">
          <div class="nav-row" style="margin-bottom: 20px;">
                <a href="https://bloxdworldcode.vercel.app" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-big-left preview-icon"><path d="M10.793 19.793a.707.707 0 0 0 1.207-.5V16a1 1 0 0 1 1-1h6a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1h-6a1 1 0 0 1-1-1V4.707a.707.707 0 0 0-1.207-.5l-6.94 6.94a1.207 1.207 0 0 0 0 1.707z"/></svg> Back</a>
            </div>
            <div class="logo-area">
                <h1>BloxdWorldCode</h1>
                <span class="badge">WORKSHOP</span>
            </div>
            <p class="subtitle">Share and discover world codes, commands, scripts, and custom UI tweaks.</p>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('browse')">Browse Mods</button>
                      <button class="tab-btn" onclick="switchTab('trending')">Trending</button>
                <button class="tab-btn" onclick="switchTab('submit')">Submit Mod</button>
            </div>
        </header>

        <!-- Tab: Browse Mods -->
        <main id="tab-browse" class="tab-content active-content">
        
            <div class="search-container" style="margin-bottom: 25px; width: 100%;">
                <input type="text" id="search-bar" placeholder="🔎 Search mods by title, creator, or description..." oninput="filterMods()" style="width: 100%; box-sizing: border-box; background: var(--bg-input); border: 2px solid var(--border); padding: 14px; color: #ffffff; font-family: inherit; font-size: 1rem; outline: none; transition: border-color 0.2s;">
            </div>
            <div id="mods-loading" class="loading"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-loader preview-icon"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg> Loading....</div>
            <div id="mods-grid" class="mods-grid"></div>
        </main>
   <div class="pagination-container" style="text-align: center; margin-top: 30px;">
                <button id="load-more-btn" class="submit-btn" style="display: none; max-width: 200px; margin: 0 auto;">Load More</button>
            </div>
        </main>
            <section id="tab-trending" class="tab-content">
            <div style="margin-bottom: 25px;">
                <h2 style="margin: 0 0 5px 0; color: var(--text-main);"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-flame preview-icon"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/></svg> Trending</h2>
                <p style="margin: 0; color: var(--text-body); font-size: 0.9rem;">Nothing here! This section is UNDER development!</p>
            </div>
            <div id="trending-grid" class="mods-grid"></div>
        </section>
        <!-- Tab: Submit Mod -->
        <section id="tab-submit" class="tab-content">
            <form id="mod-form" class="mod-form">
                <div class="form-group">
                    <label for="title">Mod Title</label>
                    <input type="text" id="title" maxlength="100" placeholder="e.g., Infinite Jump Script, Custom Crosshair..." required>
                </div>
                <div class="form-group">
                    <label for="creator">Username</label>
                    <input type="text" id="creator" maxlength="50" placeholder="Your username... " required>
                </div>
                <div class="form-group">
                    <label for="description">Description & Features</label>
                    <textarea id="description" rows="3" maxlength="500" placeholder="What does this mod or configuration do?" required></textarea>
                </div>
                <div class="form-group">
                    <label for="code">Code</label>
                    <textarea id="code" class="code-input"         rows="10" 
        maxlength="5000" placeholder="Paste your Bloxd.io commands, CSS layout, or script here..." required></textarea>
                </div>

                   <div class="verification-gate" style="display: flex; align-items: center; gap: 10px; margin: 25px 0; padding: 15px; border: 2px solid var(--border); background: var(--bg-input);">
        <input 
            type="checkbox" 
            id="human-gate-check" 
            style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--text-main);"
            onchange="document.getElementById('publish-submit-btn').disabled = !this.checked;">
        <label for="human-gate-check" style="font-size: 0.9rem; font-weight: bold; color: var(--text-main); cursor: pointer; user-select: none;">
            Confirm you are human <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield preview-icon"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
        </label>
    </div>
                
                <button type="submit" id="publish-submit-btn" class="submit-btn" disabled>Publish <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-globe-check preview-icon"><path d="m15 6 2 2 4-4"/><path d="M2 12h20A10 10 0 1 1 12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 4-10"/></svg></button>
            </form>
        </section>
    </div>

    <!-- Interactive Pop-up Modal for Inspecting Mods -->
    <div id="mod-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Mod Details</h2>
                <button class="close-modal-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-meta">Published by <span id="modal-creator" class="highlight"></span></div>
                <p id="modal-description"></p>
                
                <label class="block-label"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-hat-glasses preview-icon"><path d="M14 18a2 2 0 0 0-4 0"/><path d="m19 11-2.11-6.657a2 2 0 0 0-2.752-1.148l-1.276.61A2 2 0 0 1 12 4H8.5a2 2 0 0 0-1.925 1.456L5 11"/><path d="M2 11h20"/><circle cx="17" cy="18" r="3"/><circle cx="7" cy="18" r="3"/></svg> Code Preview</label>
                <!-- Rounded box containing the code preview -->
                <div class="code-preview-box">
                    <pre><code id="modal-code"></code></pre>
                </div>
            </div>
            <div class="modal-footer">
                <button id="modal-copy-btn" class="modal-action-btn copy-action"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy preview-icon"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
                <button class="modal-action-btn close-action" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>
 <footer class="workshop-footer">
        <p>&copy; 2026 Shahadah Studios Elite | BloxdWorldCode - DO NOT USE WEB TITLE WITHOUT LICENCE</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
